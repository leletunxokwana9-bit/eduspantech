<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%234f46e5'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Arial,sans-serif' font-size='56' font-weight='bold' fill='%23ffffff'%3E%26%238721;%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%234f46e5'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Arial,sans-serif' font-size='56' font-weight='bold' fill='%23ffffff'%3E%26%238721;%3C/text%3E%3C/svg%3E" />
    
    <!-- ===== PRIMARY TITLE (This is what shows in Google) ===== -->
    <title>EduSpantech - Global Mathematics Tutoring Platform | South Africa</title>
    
    <!-- ===== CRITICAL SEO META TAGS ===== -->
    <meta name="description" content="EduSpantech is South Africa's premier online mathematics tutoring platform. Expert tutors for Grade 8 to 2nd-Year Tertiary students. CAPS, IEB, and international curricula." />
    <meta name="keywords" content="EduSpantech, mathematics tutoring, online math tutor, South Africa, CAPS curriculum, IEB, grade 8 math, high school math, university math, algebra, calculus, geometry" />
    <meta name="author" content="EduSpantech (Pty) Ltd" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- ===== OPEN GRAPH (For social media & Google) ===== -->
    <meta property="og:title" content="EduSpantech - Global Mathematics Tutoring Platform" />
    <meta property="og:description" content="Expert mathematics tutoring from Grade 8 to University. South Africa's trusted platform for CAPS, IEB, and international curricula." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.eduspantech.com" />
    <meta property="og:site_name" content="EduSpantech" />
    <meta property="og:locale" content="en_ZA" />
    
    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduSpantech - Global Mathematics Tutoring Platform" />
    <meta name="twitter:description" content="Expert mathematics tutoring from Grade 8 to University. South Africa's trusted platform." />
    
    <!-- ===== ADDITIONAL SEO ===== -->
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="https://www.eduspantech.com" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- ===== STRUCTURED DATA (JSON-LD) - TELLS GOOGLE WHO YOU ARE ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "EduSpantech",
      "description": "Global mathematics tutoring platform serving students from Grade 8 to 2nd-Year Tertiary. Expert tutors, multiple curricula including CAPS, IEB, and international standards.",
      "url": "https://www.eduspantech.com",
      "logo": "https://www.eduspantech.com/sum-icon.svg",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ZA"
      },
      "sameAs": [
        "https://twitter.com/eduspantech",
        "https://linkedin.com/company/eduspantech"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="text-align:center;padding:50px;font-family:Arial,sans-serif;">
        <h1>📚 EduSpantech</h1>
        <p>Please enable JavaScript to use this educational platform.</p>
        <p>Education for the love of your life ❤️</p>
      </div>

    <div id="root"></div>
  </body>
</html>
