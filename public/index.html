<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2c3e50" />
    
    <!-- CHANGE THIS: Description for search engines -->

      name="description"
      content="EduSpantech - Global mathematics tutoring platform for Grade 8 to 2nd-Year Tertiary students. Education for the love of your life ❤️"

    <!-- CHANGE THIS: Author -->

    <!-- Icons - Replace these with your own icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- CHANGE THIS: The title that appears in the browser tab -->
    <title>EduSpantech - Global Math Tutoring</title>
